<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extrator de Telefones</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center min-h-screen"
  >
    <div
      class="bg-white bg-opacity-80 backdrop-blur-md rounded-xl shadow-xl p-8 w-full max-w-md text-center"
    >
      <h1 class="text-2xl font-semibold text-gray-800 mb-4">Extrator de Telefones por Vídeo</h1>
      <button
        id="selectBtn"
        class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition mb-3"
      >
        Selecione o vídeo
      </button>
      <span id="filePath" class="block text-sm text-gray-600 mb-3 truncate"></span>
      <button
        id="extractBtn"
        disabled
        class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition mb-3"
      >
        Extrair Telefones
      </button>
      <div id="progress" class="text-sm text-gray-700 mb-2"></div>
      <div id="timer" class="text-sm text-gray-700 mb-2"></div>
      <pre id="results" class="bg-gray-50 p-3 rounded text-left overflow-auto max-h-48"></pre>
      <button
        id="saveBtn"
        style="display: none"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition mt-3"
      >
        Salvar Resultados
      </button>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
